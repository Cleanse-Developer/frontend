name: Build and deploy

# Every push to main is guarded, built and (once AWS is configured) deployed to EC2.
# Pull requests only get the guard + build (no secrets, no deploy).
# Setup instructions: docs/DEPLOY.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, upload and run the deploy script on the server WITHOUT changing anything there (tests the AWS wiring)"
        type: boolean
        default: false

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Guard and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain shell, before any npm/node code runs. See scripts/ci-guard.sh.
      - name: Guard
        run: bash scripts/ci-guard.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Only export values you have actually set. Next does not let .env.production
      # override a variable that already exists - even an empty one - so passing unset
      # repository variables straight through would blank them (and break the site).
      - name: Build-time public config
        env:
          V_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          V_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          V_ADS_LABEL: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL }}
          V_CURRENCY: ${{ vars.NEXT_PUBLIC_CURRENCY }}
          V_SLIDE_KEY: ${{ vars.NEXT_PUBLIC_SLIDE_SITE_KEY }}
        run: |
          set_if() { if [ -n "$2" ]; then echo "$1=$2" >> "$GITHUB_ENV"; echo "using repository variable for $1"; fi; }
          if [ -n "$V_API_URL" ] && [[ "$V_API_URL" != https://* ]]; then
            echo "::error::NEXT_PUBLIC_API_URL must start with https:// (got '$V_API_URL')"; exit 1
          fi
          set_if NEXT_PUBLIC_API_URL "$V_API_URL"
          set_if NEXT_PUBLIC_GTM_ID "$V_GTM_ID"
          set_if NEXT_PUBLIC_META_PIXEL_ID "$V_PIXEL_ID"
          set_if NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL "$V_ADS_LABEL"
          set_if NEXT_PUBLIC_CURRENCY "$V_CURRENCY"
          set_if NEXT_PUBLIC_SLIDE_SITE_KEY "$V_SLIDE_KEY"
          if [ -z "$V_SLIDE_KEY" ]; then
            echo "::warning title=Synquic Slide::repository variable NEXT_PUBLIC_SLIDE_SITE_KEY is not set, so this build will NOT include the Synquic script (docs/DEPLOY.md)"
          fi

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # .next is still tracked in git while the old deploy path exists; start clean
          # so stale files from a previous commit cannot end up in the release.
          rm -rf .next
          npm run build

      - name: Package release
        run: bash scripts/package-release.sh release.tgz

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    # Off until you set the repository variable DEPLOY_ENABLED=true (docs/DEPLOY.md). A manual
    # dry run (Run workflow, tick 'Dry run') works even while it is off: it changes nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # lets this job assume the AWS role through GitHub's OIDC token
    steps:
      # public/ is ~200 MB and rarely changes, so it is not part of the build artifact.
      # Check out only that folder. This step must come first: checkout cleans the
      # workspace, which would delete the artifact if it were downloaded before it.
      - name: Check out public/ only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: public
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release and create a 15-minute download link
        id: s3
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          KEY="releases/${APP_NAME}/${GITHUB_SHA}.tgz"
          aws s3 cp release.tgz "s3://${BUCKET}/${KEY}" --only-show-errors
          URL="$(aws s3 presign "s3://${BUCKET}/${KEY}" --expires-in 900)"
          echo "::add-mask::${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

          # public/ is content-addressed by its git tree hash: uploaded once per change,
          # and the server only downloads it when the hash differs from its last deploy.
          if [ -d public ]; then
            PUB_HASH="$(git rev-parse HEAD:public)"
            PUB_KEY="releases/${APP_NAME}/public-${PUB_HASH}.tgz"
            if aws s3api head-object --bucket "$BUCKET" --key "$PUB_KEY" >/dev/null 2>&1; then
              echo "public/ ${PUB_HASH} is already in S3"
            else
              echo "uploading public/ ${PUB_HASH}"
              tar -C public -czf public.tgz .
              aws s3 cp public.tgz "s3://${BUCKET}/${PUB_KEY}" --only-show-errors
            fi
            PUB_URL="$(aws s3 presign "s3://${BUCKET}/${PUB_KEY}" --expires-in 900)"
            echo "::add-mask::${PUB_URL}"
            echo "public_url=${PUB_URL}" >> "$GITHUB_OUTPUT"
            echo "public_hash=${PUB_HASH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy through SSM
        env:
          RELEASE_URL: ${{ steps.s3.outputs.url }}
          PUBLIC_URL: ${{ steps.s3.outputs.public_url }}
          PUBLIC_HASH: ${{ steps.s3.outputs.public_hash }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.APP_DIR }}
          APP_USER: ${{ vars.APP_USER || 'ubuntu' }}
          PM2_PROCESS: ${{ vars.PM2_PROCESS }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:3000/' }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for v in INSTANCE_ID APP_DIR PM2_PROCESS; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (docs/DEPLOY.md)"; exit 1; }
          done
          q() { printf '%q' "$1"; }

          # SSM runs this as root. The shebang matters: without it SSM uses /bin/sh (dash),
          # which has no `pipefail`.
          SCRIPT="$(cat <<EOF
          #!/bin/bash
          set -euo pipefail
          T="\$(mktemp -d)"
          trap 'rm -rf "\$T"' EXIT
          curl -fsSL --retry 3 --retry-delay 2 -o "\$T/release.tgz" $(q "$RELEASE_URL")
          tar -xzf "\$T/release.tgz" -C "\$T"
          chown -R $(q "$APP_USER") "\$T"
          sudo -u $(q "$APP_USER") -H env APP_DIR=$(q "$APP_DIR") PM2_PROCESS=$(q "$PM2_PROCESS") HEALTH_URL=$(q "$HEALTH_URL") PUBLIC_URL=$(q "$PUBLIC_URL") PUBLIC_HASH=$(q "$PUBLIC_HASH") DRY_RUN=$(q "$DRY_RUN") bash "\$T/deploy/deploy-remote.sh" "\$T"
          EOF
          )"

          PARAMS="$(jq -cn --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["900"]}')"
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${APP_NAME} ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $CMD_ID"

          deadline=$((SECONDS + 900))
          while :; do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::timed out waiting for SSM"; exit 1; fi
            sleep 5
          done

          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          ERR="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)"
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then echo "----- server stderr -----"; echo "$ERR"; fi
          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]
